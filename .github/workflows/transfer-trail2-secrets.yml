name: One-time transfer of Trail Play publishing secrets to Trail 2

# Run manually after configuring TRAIL2_SECRETS_TRANSFER_TOKEN on this (source) repo.
# Remove this workflow and the transfer token when the migration is complete.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copy-secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.TRAIL2_SECRETS_TRANSFER_TOKEN }}
      UPLOAD_KEY: ${{ secrets.TRAIL_UPLOAD_KEYSTORE_BASE64 }}
      UPLOAD_PASSWORD: ${{ secrets.TRAIL_UPLOAD_PASSWORD }}
      PLAY_SERVICE_ACCOUNT: ${{ secrets.TRAIL_PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Verify prerequisites and destination access
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" || -z "$UPLOAD_KEY" || -z "$UPLOAD_PASSWORD" ]]; then
            echo "::error::Missing transfer token, upload keystore, or upload password in the source repository."
            exit 1
          fi
          gh api repos/mbligh/trail2/actions/secrets/public-key --jq '.key_id' > /dev/null
      - name: Copy publishing secrets directly to trail2
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$UPLOAD_KEY" | gh secret set TRAIL_UPLOAD_KEYSTORE_BASE64 --repo mbligh/trail2
          printf '%s' "$UPLOAD_PASSWORD" | gh secret set TRAIL_UPLOAD_PASSWORD --repo mbligh/trail2
          if [[ -n "$PLAY_SERVICE_ACCOUNT" ]]; then
            printf '%s' "$PLAY_SERVICE_ACCOUNT" | gh secret set TRAIL_PLAY_SERVICE_ACCOUNT_JSON --repo mbligh/trail2
            echo "Transferred upload key, upload password and Play service-account credentials."
          else
            echo "Transferred upload key and upload password; Play service-account credentials were not present."
          fi
